name: Desktop Linux

on:
  push:
    branches: [master, main, phase-01-desktop-baseline, phase-02-steins-compatibility, phase-03-sghd-implementation]
  pull_request:
    branches: [master, main, phase-03-sghd-implementation]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VCPKG_COMMIT: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9
      VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
      VCPKG_MAX_CONCURRENCY: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux prerequisites
        run: sudo bash .github/scripts/install-desktop-deps.sh
      - name: Asset-free compatibility unit tests (synthetic SGHD fixtures)
        run: python3 -m unittest discover -s tests/compat -v
      - name: Install pinned CMake
        run: |
          python3 -m venv .tools/cmake
          .tools/cmake/bin/pip install cmake==3.31.10
          echo "$GITHUB_WORKSPACE/.tools/cmake/bin" >> "$GITHUB_PATH"
      - name: Bootstrap pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p .cache/vcpkg ci-build/logs
      - uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: desktop-ubuntu24-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg*.json', 'portfiles/**', 'triplets/**') }}
      - name: Record toolchain
        run: |
          { cat /etc/os-release; gcc --version; g++ --version; cmake --version; ninja --version; "$VCPKG_ROOT/vcpkg" version; } | tee ci-build/logs/toolchain.log
      - name: Configure
        run: cmake --preset ci-release -DVCPKG_TARGET_TRIPLET=x64-linux-ci -DVCPKG_HOST_TRIPLET=x64-linux-ci 2>&1 | tee ci-build/logs/configure.log
      - name: Compile and install
        run: cmake --build --preset ci-release 2>&1 | tee ci-build/logs/build.log
      - name: Discover upstream tests
        # Upstream currently registers no CTest tests; this is NOT a test pass.
        run: ctest --test-dir ci-build/ci-release --output-on-failure 2>&1 | tee ci-build/logs/ctest.log
      - name: Run asset-free launcher smoke checks
        run: xvfb-run -a python3 .github/scripts/desktop-smoke.py release/ci-release/impacto 2>&1 | tee ci-build/logs/smoke.log
      - name: STEINS;GATE runtime probes and VM harness (synthetic fixtures, real binary)
        # sgps3 probes pin the frozen PS3 profile's known bugs; sghd probes and the
        # asset-free profiles/sghd-harness run SCX fixtures through the real VM.
        env:
          IMPACTO_BIN: ${{ github.workspace }}/release/ci-release/impacto
        run: python3 -m unittest tests.compat.test_runtime_probe -v 2>&1 | tee ci-build/logs/runtime-probe.log
      # Only build outputs and open-source resources are packaged here.
      # The owner's Steam MPKs / BK2s are never part of GitHub CI or artifacts.
      # This artifact lets the developer execute the exact same Linux build
      # locally with privately supplied assets under Xvfb for gameplay tests.
      - name: Upload Linux runtime (source-only, no commercial game data)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: impacto-linux-x64-${{ github.sha }}
          path: release/ci-release/
          retention-days: 7
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-logs
          path: |
            ci-build/logs/
            ci-build/ci-release/vcpkg-manifest-install.log
            .tools/vcpkg/buildtrees/**/*.log
          retention-days: 14
