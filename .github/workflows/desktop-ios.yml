name: iOS ARM64

# Thread 08: native iOS ARM64 build of the existing C++ engine on a GitHub
# macOS runner. Asset-free (no game data), unsigned: signing is done by the
# owner on a Mac (docs/ios-build.md). The Linux/Windows desktop workflows stay
# the functional test beds.

on:
  push:
    branches: [phase-04-ios-build, phase-03-sghd-implementation]
  pull_request:
    branches: [master, phase-03-sghd-implementation]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# queue instead of cancelling: a cold vcpkg build takes long and every
# finished run refreshes the binary cache
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      VCPKG_COMMIT: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9
      VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
      VCPKG_MAX_CONCURRENCY: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
    steps:
      - uses: actions/checkout@v6
      - name: Asset-free compatibility unit tests
        run: python3 -m unittest discover -s tests/compat -v
      - name: Install pinned CMake and Ninja
        run: |
          python3 -m venv .tools/cmake
          .tools/cmake/bin/pip install cmake==3.31.10 ninja==1.13.0
          echo "$GITHUB_WORKSPACE/.tools/cmake/bin" >> "$GITHUB_PATH"
      - name: Bootstrap pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p .cache/vcpkg ci-build/logs artifacts
      # restore/save split so binaries built before a failure are kept
      - uses: actions/cache/restore@v4
        with:
          path: .cache/vcpkg
          key: ios-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg-ios.json', 'triplets/arm64-ios.cmake') }}-${{ github.run_id }}
          restore-keys: ios-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg-ios.json', 'triplets/arm64-ios.cmake') }}-
      - name: Record toolchain
        run: |
          { sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version;
            xcrun --sdk iphoneos --show-sdk-path; cmake --version; ninja --version;
            "$VCPKG_ROOT/vcpkg" version; } | tee ci-build/logs/toolchain.log
      - name: Configure
        run: cmake --preset ci-release-ios 2>&1 | tee ci-build/logs/configure.log
      - name: Build and install
        run: cmake --build --preset ci-release-ios 2>&1 | tee ci-build/logs/build.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/vcpkg
          key: ios-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg-ios.json', 'triplets/arm64-ios.cmake') }}-${{ github.run_id }}
      - name: Verify the app bundle
        run: |
          set -euo pipefail
          APP="release/ci-release-ios/Impacto.app"
          test -d "$APP"
          test -x "$APP/Impacto"
          for entry in Info.plist basepaths.lua gamedefinitions.lua profiles shaders resources; do
            test -e "$APP/$entry" || { echo "missing bundle entry: $entry"; exit 1; }
          done
          plutil -lint "$APP/Info.plist" | tee ci-build/logs/plist.log
          plutil -p "$APP/Info.plist" | tee ci-build/logs/plist-dump.log
          lipo -info "$APP/Impacto" | tee ci-build/logs/lipo.log
          lipo -info "$APP/Impacto" | grep -q "arm64" || { echo "not an arm64 binary"; exit 1; }
          xcrun vtool -show-build "$APP/Impacto" | tee ci-build/logs/vtool.log
          xcrun vtool -show-build "$APP/Impacto" | grep -q "platform IOS" || { echo "not an iOS binary"; exit 1; }
          # Ninja does not sign; an ad-hoc signature from ld is not identity signing.
          codesign -dvvv "$APP" 2>&1 | tee ci-build/logs/codesign.log || true
          du -sh "$APP" | tee -a ci-build/logs/lipo.log
      - name: Package unsigned app
        run: |
          set -euo pipefail
          ZIP="artifacts/impacto-ios-arm64-unsigned-${GITHUB_SHA}.zip"
          ditto -c -k --sequesterRsrc --keepParent release/ci-release-ios/Impacto.app "$ZIP"
          printf '%s\n' "dependencies: vcpkg ${VCPKG_COMMIT}, SDL3 static, no audio/video/libass" > artifacts/README.txt
          shasum -a 256 "$ZIP" | tee artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: impacto-ios-arm64-${{ github.sha }}
          path: artifacts/
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-arm64-logs
          path: |
            ci-build/logs/
            ci-build/ci-release-ios/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
          retention-days: 14
